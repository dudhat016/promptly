name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          # Add other VITE_ variables here if needed

      - name: 🛠️ Build Backend (server.mjs)
        run: npx esbuild server.ts --bundle --platform=node --format=esm --target=node20 --outfile=server.mjs --packages=external

      - name: 🔐 Inject Secrets
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json
          echo '${{ secrets.ENV_FILE }}' > .env

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/promptly/
          # We only upload what is needed for the production server to run
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            src/**
            tsconfig.json
            vite.config.ts
            package-lock.json
            README.md
            .env.example
            *.ts
            !server.mjs
