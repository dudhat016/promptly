name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔐 Inject Secrets
        run: echo '${{ secrets.ENV_FILE }}' > .env

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Frontend
        run: npm run build

      - name: 🛠️ Build Backend & Prepare Dist
        run: |
          npx esbuild server.ts --bundle --platform=node --format=esm --target=node20 --outfile=dist/server.mjs --packages=external
          cp public/.htaccess dist/.htaccess || true

      - name: 🚀 Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/promptly/
          protocol: ftp
          port: 21
          timeout: 120000
          security: strict
