name: Cron Jobs

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 min — automation-tick + process-broadcasts
    - cron: '0 * * * *'     # every hour — segment-rebuild
  workflow_dispatch:         # allow manual trigger from GitHub UI

env:
  APP_URL: ${{ secrets.APP_URL }}
  AUTH: "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

jobs:
  automation-tick:
    name: Automation Tick (every 10 min)
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/automation-tick
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -X POST "$APP_URL/api/cron/automation-tick" \
            -H "$AUTH" \
            -H "Content-Type: application/json")
          echo "Response: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

  segment-rebuild:
    name: Segment Rebuild (every hour)
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/segment-rebuild
        run: |
          MINUTE=$(date +%M)
          if [ "$MINUTE" = "00" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L \
              -X POST "$APP_URL/api/cron/segment-rebuild" \
              -H "$AUTH" \
              -H "Content-Type: application/json")
            echo "Response: $STATUS"
            [ "$STATUS" = "200" ] || exit 1
          else
            echo "Skipping — not on the hour (minute=$MINUTE)"
          fi

  process-broadcasts:
    name: Process Broadcasts (every 10 min)
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/process-broadcasts
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -X POST "$APP_URL/api/cron/process-broadcasts" \
            -H "$AUTH" \
            -H "Content-Type: application/json")
          echo "Response: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
