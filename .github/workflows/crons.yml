name: Cron Jobs

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 min — triggers all jobs; nudges/segments skip unless on the hour
    - cron: '0 * * * *'     # every hour — ensures nudges + segment-rebuild fire exactly on the hour
  workflow_dispatch:         # allow manual trigger from GitHub UI

env:
  APP_URL: ${{ secrets.APP_URL }}
  AUTH: "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

jobs:
  automation-tick:
    name: Automation Tick (every 10 min)
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/automation-tick
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$APP_URL/api/cron/automation-tick" \
            -H "$AUTH" \
            -H "Content-Type: application/json")
          echo "Response: $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "304" ] || exit 1

  nudges:
    name: Nudges (every hour)
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/nudges
        run: |
          MINUTE=$(date +%M)
          if [ "$MINUTE" = "00" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$APP_URL/api/cron/nudges" \
              -H "$AUTH" \
              -H "Content-Type: application/json")
            echo "Response: $STATUS"
            [ "$STATUS" = "200" ] || exit 1
          else
            echo "Skipping — not on the hour (minute=$MINUTE)"
          fi

  segment-rebuild:
    name: Segment Rebuild (every hour)
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/segment-rebuild
        run: |
          MINUTE=$(date +%M)
          if [ "$MINUTE" = "00" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$APP_URL/api/cron/segment-rebuild" \
              -H "$AUTH" \
              -H "Content-Type: application/json")
            echo "Response: $STATUS"
            [ "$STATUS" = "200" ] || exit 1
          else
            echo "Skipping — not on the hour (minute=$MINUTE)"
          fi

  process-locks:
    name: Process Locks (daily 03:00 UTC)
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/process-locks
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date +%M)
          if [ "$HOUR" = "03" ] && [ "$MINUTE" = "00" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$APP_URL/api/cron/process-locks" \
              -H "$AUTH" \
              -H "Content-Type: application/json")
            echo "Response: $STATUS"
            [ "$STATUS" = "200" ] || exit 1
          else
            echo "Skipping — not 03:00 UTC (hour=$HOUR minute=$MINUTE)"
          fi

  expire-trials:
    name: Expire Trials (daily 04:00 UTC)
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/expire-trials
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date +%M)
          if [ "$HOUR" = "04" ] && [ "$MINUTE" = "00" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$APP_URL/api/cron/expire-trials" \
              -H "$AUTH" \
              -H "Content-Type: application/json")
            echo "Response: $STATUS"
            [ "$STATUS" = "200" ] || exit 1
          else
            echo "Skipping — not 04:00 UTC (hour=$HOUR minute=$MINUTE)"
          fi

  auto-payouts:
    name: Auto Payouts (daily 05:00 UTC)
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/auto-payouts
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date +%M)
          if [ "$HOUR" = "05" ] && [ "$MINUTE" = "00" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$APP_URL/api/cron/auto-payouts" \
              -H "$AUTH" \
              -H "Content-Type: application/json")
            echo "Response: $STATUS"
            [ "$STATUS" = "200" ] || exit 1
          else
            echo "Skipping — not 05:00 UTC (hour=$HOUR minute=$MINUTE)"
          fi
